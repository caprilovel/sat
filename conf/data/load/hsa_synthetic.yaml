# @package _global_

# data_source: ${base_dir}/data/hsa-synthetic/simulated_data.csv
# data_source: ${base_dir}/data/hsa-synthetic/synthetic_data.csv
# data_source: ${base_dir}/data/hsa-synthetic/correlated_linear_data_event3.csv
# data_source: ${base_dir}/data/hsa-synthetic/realistic_survival_data_event4.csv
data_source: ${base_dir}/data/hsa-synthetic/signal_survival_data_event3.csv

data:
  preprocess_data: false
  perform_split: true
  split_col: split
  duration_col: durations
  event_col: events
  id_col: id
  num_events: 3
  transformed_duration_cols:
    - t
    - f
  splits:
    - train
    - valid
    - test
  load:
    _target_: datasets.load_dataset
    path: json
    data_files:
      - ${modelhub}/${dataset}/${fold}${dataset}.json
    streaming: false
